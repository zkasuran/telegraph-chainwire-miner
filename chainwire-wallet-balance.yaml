version: "1"
kind: miner
id: 7303
slug: chainwire-wallet-balance
protocol: generic
name: ChainWire Wallet Balance
description: >
  Native-coin balance of an address or ENS name on a named EVM chain, read live from
  public RPC endpoints at request time. Answers the WALLET_BALANCE_CHECK intent for
  Ethereum, Base, Arbitrum, Optimism, Polygon and the Base Sepolia and Sepolia
  testnets. ENS names resolve on mainnet through public resolvers. No API key, the
  figure comes straight from eth_getBalance.
base_url: https://telegraph-chain.margyn.workers.dev

docs:
  documentation: https://telegraph-chain.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: chain must be one of ethereum, base, arbitrum, optimism, polygon, base-sepolia, sepolia. Address is a 0x account or an ENS name ending in .eth.
    param: chain
    property: length
    value_num: 40
    operator: lte

rate_limit_per_sec: 20
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    chain:
      type: string
      description: EVM chain name, for example ethereum, base, arbitrum, optimism, polygon.
    address:
      type: string
      description: A 0x account address or an ENS name ending in .eth.
  required:
    - chain
    - address

output_schema:
  type: object
  properties:
    address:
      type: string
      description: The 0x address the balance is for.
    ens:
      type: string
      description: The ENS name, when the lookup started from one.
    chain:
      type: string
      description: Canonical chain name the answer refers to.
    chain_id:
      type: integer
      description: EVM chain id.
    symbol:
      type: string
      description: Native coin symbol, ETH or POL.
    balance:
      type: number
      description: Native balance in whole coins.
    balance_raw:
      type: string
      description: Same balance in wei, as a decimal string.
    confidence:
      type: number
      description: 0.98 for a direct eth_getBalance read.
    summary:
      type: string
      description: One sentence naming the address, the balance and the chain.
    as_of:
      type: string
      description: ISO 8601 timestamp of the read.

endpoints:
  - path: /balance
    external_path: /balance
    method: GET
    description: >
      Native balance for one address, chain and address as query parameters
      (?chain=base&address=0x...). Accepts an ENS name and a whole question in ?query=.
  - path: /balance/{chain}/{address}
    external_path: /balance/{chain}/{address}
    method: GET
    description: >
      Same answer with chain and address in the path. An unsubstituted template
      resolves to ethereum rather than erroring.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: symbol
    reason_field: summary
  supported_intents:
    - WALLET_BALANCE_CHECK

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: address
        description: The 0x address the balance is for.
        source_path: address
      - index: 1
        name: chain
        description: Canonical chain name the answer refers to.
        source_path: chain
      - index: 2
        name: summary
        description: One sentence naming the address, the balance and the chain.
        source_path: summary
    integers:
      - index: 0
        name: balance_x1000000
        description: Native balance in whole coins, scaled by one million to keep six decimals as an integer.
        source_path: balance
        multiplier: 1000000
      - index: 1
        name: chain_id
        description: EVM chain id of the network.
        source_path: chain_id
        multiplier: 1
  request:
    - endpoint: balance
      method: GET
      query_params:
        address: { source: strings.0 }
        chain: { source: strings.1 }
